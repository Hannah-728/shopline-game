<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHOPLINE 新人探索冒險：探索團隊核心密碼</title>
  <style>
    /* 萃取 SHOPLINE 辦公室主視覺科技天藍與深邃黑夜色調 */
    :root {
      --bg-dark: #0a0f18;
      --panel-bg: rgba(16, 26, 42, 0.92);
      --panel-border: #1b3554;
      --cyan-bright: #00C2FF;
      --cyan-deep: #0077B6;
      --cyan-glow: rgba(0, 194, 255, 0.35);
      --accent-green: #00E599;
      --accent-gold: #FFD166;
      --text-main: #E2F1FF;
      --text-sub: #8EA8C3;
      --pixel-font: "Courier New", "Noto Sans TC", monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 194, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 119, 182, 0.15) 0%, transparent 50%);
      color: var(--text-main);
      font-family: var(--pixel-font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部科技導覽列 */
    header {
      height: 52px;
      background: rgba(10, 15, 24, 0.95);
      border-bottom: 2px solid var(--cyan-deep);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 4px 15px var(--cyan-glow);
      z-index: 50;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--cyan-bright);
      text-shadow: 0 0 10px var(--cyan-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-badge {
      font-size: 0.85rem;
      background: #112233;
      padding: 4px 10px;
      border: 1px solid var(--cyan-bright);
      border-radius: 4px;
      color: var(--text-main);
    }

    .mobile-backpack-btn {
      display: none;
      background: #132b45;
      color: var(--cyan-bright);
      border: 1px solid var(--cyan-bright);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 主舞台佈局 */
    .game-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左側主舞台：像素場景 */
    .viewport {
      flex: 1.3;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--panel-border);
      background: #080c14;
      overflow: hidden;
    }

    .scene-meta {
      padding: 10px 16px;
      background: rgba(16, 26, 42, 0.7);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scene-title {
      color: var(--cyan-bright);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .interactive-canvas {
      flex: 1;
      position: relative;
      background: radial-gradient(#17273d 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 像素發光地圖物件 */
    .hotspot {
      position: absolute;
      width: 76px;
      height: 76px;
      background: rgba(16, 32, 54, 0.85);
      border: 2px solid var(--cyan-bright);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulse 2s infinite alternate;
    }

    .hotspot:hover, .hotspot:active {
      transform: scale(1.08);
      background: rgba(0, 194, 255, 0.2);
      border-color: #ffffff;
      box-shadow: 0 0 25px var(--cyan-bright);
    }

    .hotspot.collected {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 229, 153, 0.4);
      opacity: 0.75;
    }

    .hotspot .icon {
      font-size: 24px;
      margin-bottom: 3px;
    }

    .hotspot .label {
      font-size: 10px;
      text-align: center;
      color: var(--text-main);
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* NPC 人物立繪按鈕 */
    .npc-avatar {
      position: absolute;
      bottom: 25px;
      right: 35px;
      width: 100px;
      height: 125px;
      background: linear-gradient(180deg, #183353 0%, #0d1e33 100%);
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.35);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 10;
    }

    .npc-avatar:hover, .npc-avatar:active {
      transform: scale(1.05);
    }

    .npc-badge {
      position: absolute;
      top: -12px;
      background: var(--accent-gold);
      color: #000;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 8px var(--cyan-glow); }
      100% { box-shadow: 0 0 22px var(--cyan-bright); }
    }

    /* 右側面板：手冊與任務 */
    .sidebar {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-block {
      background: rgba(10, 16, 26, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 14px;
    }

    .panel-header {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--cyan-bright);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 6px;
    }

    .quest-item {
      font-size: 0.85rem;
      padding: 7px 10px;
      margin-bottom: 6px;
      background: #0f1d2e;
      border-left: 3px solid #355375;
      color: var(--text-sub);
      border-radius: 0 4px 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quest-item.completed {
      border-left-color: var(--accent-green);
      color: var(--text-main);
      background: #0f2a28;
    }

    /* 道具手冊網格 */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .inventory-slot {
      aspect-ratio: 1;
      background: #0d1724;
      border: 1px dashed #244263;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .inventory-slot.unlocked {
      border: 1px solid var(--cyan-bright);
      background: rgba(0, 194, 255, 0.1);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .inventory-slot .slot-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .inventory-slot .slot-name {
      font-size: 10px;
      color: var(--text-main);
      word-break: break-all;
    }

    /* 浮層 Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 14, 0.88);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-box {
      background: #0f1a2a;
      border: 2px solid var(--cyan-bright);
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 35px var(--cyan-glow);
      overflow: hidden;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-head {
      background: linear-gradient(90deg, #132b45, #0a1626);
      padding: 12px 18px;
      border-bottom: 1px solid var(--cyan-deep);
      font-weight: bold;
      color: var(--cyan-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      max-height: 65vh;
      overflow-y: auto;
    }

    .modal-foot {
      padding: 12px 18px;
      background: #0a1320;
      border-top: 1px solid var(--panel-border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 科技感按鈕 */
    .btn {
      background: var(--cyan-deep);
      color: #fff;
      border: 1px solid var(--cyan-bright);
      padding: 8px 16px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--pixel-font);
      font-weight: bold;
      transition: all 0.15s;
    }

    .btn:hover, .btn:active {
      background: var(--cyan-bright);
      color: #000;
      box-shadow: 0 0 15px var(--cyan-bright);
    }

    .btn-secondary {
      background: transparent;
      border-color: #38567a;
      color: var(--text-sub);
    }

    /* 對話與出示選項樣式 */
    .dialogue-text {
      background: #09111c;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid var(--accent-gold);
      margin-bottom: 14px;
      color: #f1f7ff;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 10px 14px;
      background: #142438;
      border: 1px solid #29476b;
      border-radius: 6px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .option-btn:hover, .option-btn:active {
      background: #1c3657;
      border-color: var(--cyan-bright);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    /* 手機螢幕 RWD 自適應 */
    @media (max-width: 768px) {
      .game-container {
        flex-direction: column;
      }
      .viewport {
        flex: 1;
        border-right: none;
      }
      .mobile-backpack-btn {
        display: block;
      }
      .sidebar {
        position: fixed;
        top: 52px;
        left: 0;
        width: 100%;
        height: calc(100% - 52px);
        transform: translateY(100%);
        transition: transform 0.3s ease;
        z-index: 80;
      }
      .sidebar.open {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Google Apps Script 串接配置 -->
  <script>
    // 請將此處字串換成您的 Google Apps Script 網頁應用程式網址 (Web App URL)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzBH2KbdUe87ZLwHp2LELDcFQbyTOluli_o_HpzxXjdO5mU1qkQUV-c6I-cVc5hx3TqJg/exec"; 
  </script>

  <!-- 頂部資訊列 -->
  <header>
    <div class="brand-title">
      <span>🔷 SHOPLINE</span>
      <span style="font-size: 0.75rem; color: var(--text-sub); font-weight: normal;">| 新人入職探索</span>
    </div>
    <div style="display:flex; align-items:center; gap: 8px;">
      <div id="playerBadge" class="player-badge">探索者：未登入</div>
      <button class="mobile-backpack-btn" onclick="toggleSidebar()">🎒 隨身手冊</button>
    </div>
  </header>

  <!-- 主遊戲容器 -->
  <div class="game-container">
    <!-- 左側探索地圖舞台 -->
    <div class="viewport">
      <div class="scene-meta">
        <span id="sceneTitle" class="scene-title">第 1 章：新手報到！走進 SHOPLINE 零售世界</span>
        <span id="stepCounter" style="font-size: 0.8rem; color: var(--text-sub);">線索進度：0/3</span>
      </div>

      <div class="interactive-canvas" id="interactiveCanvas">
        <!-- 地圖點擊物件與 NPC 會由 JS 動態依章節渲染 -->
      </div>
    </div>

    <!-- 右側面板：任務與隨身手冊 -->
    <div class="sidebar" id="sidebar">
      <div style="display:flex; justify-content:space-between; align-items:center;" class="mobile-backpack-btn" onclick="toggleSidebar()">
        <span style="font-weight:bold; color:var(--cyan-bright);">關閉隨身手冊 ✕</span>
      </div>

      <!-- 任務進度清單 -->
      <div class="panel-block">
        <div class="panel-header">
          <span>📜 本章任務清單</span>
        </div>
        <div id="questList">
          <!-- 任務動態生成 -->
        </div>
      </div>

      <!-- 隨身手冊 (背包道具) -->
      <div class="panel-block">
        <div class="panel-header">
          <span>🎒 隨身手冊線索卡 (共 6 件)</span>
        </div>
        <div class="inventory-grid" id="inventoryGrid">
          <!-- 6 個道具卡位 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 彈窗系統：線索閱讀、NPC任務對話、過關結算、登入 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box" id="modalBox">
      <div class="modal-head" id="modalHead">標題</div>
      <div class="modal-body" id="modalBody">內容</div>
      <div class="modal-foot" id="modalFoot">
        <button class="btn" onclick="closeModal()">確定</button>
      </div>
    </div>
  </div>

  <script>
    // 全域遊戲狀態
    const gameState = {
      userName: "",
      startTime: null,
      chapter: 1,
      wrongAttempts: 0,
      inventory: {
        item1: false, // 70萬品牌見證名片
        item2: false, // 知名品牌合作圖鑑
        item3: false, // 電商成長學苑通行證
        item4: false, // 品牌使命指南針
        item5: false, // 國際團隊地圖
        item6: false  // 策略顧問放大鏡
      },
      taskProgress: {
        ch1_task1: false,
        ch1_task2: false,
        ch2_task3: false,
        ch2_task4: false
      }
    };

    // 6 樣道具詳細資訊
    const ITEM_CONFIG = {
      item1: {
        name: "70萬品牌見證名片",
        icon: "💳",
        title: "全方位零售專家",
        desc: "SHOPLINE 成立於 2013 年，是擁有十年以上全通路銷售與管理經驗的全方位零售整合專家，致力為各種規模的品牌提供一站式零售解決方案並實現數位轉型，服務客戶涵蓋大型企業、中小型品牌至個人創業者，在全球累計超過 70 萬家品牌客戶。"
      },
      item2: {
        name: "知名品牌合作圖鑑",
        icon: "✨",
        title: "生活中的合作夥伴",
        desc: "台灣眾多知名品牌皆選擇 SHOPLINE 作為商務拓展與數位升級的長期夥伴，知名企業客戶包含：好好生醫、青鳥旅行、綠藤生機 Greenvines、國家地理服飾、Neogence霓淨思、THE BODY SHOP美體小舖、TOYSELECT、vacanza 等。"
      },
      item3: {
        name: "電商成長學苑通行證",
        icon: "🎓",
        title: "賦能商家的軟實力",
        desc: "除了產品功能，SHOPLINE 亦持續以「知識」賦能商家經營的軟實力，設立課程資源最豐富的學習平台「電商成長學苑」，提供系統操作、趨勢講座與檔期實戰班等全方位資源，幫助商家快速掌握專業知識與實用技能。"
      },
      item4: {
        name: "品牌使命指南針",
        icon: "🧭",
        title: "共同的北極星",
        desc: "不管是技術開發、行銷業務還是後勤支援，SHOPLINE 堅信：「店家的成功才是我們的成功！」，專注實現「品牌的成功，才是 SHOPLINE 的成功」的企業使命，致力為客戶提供最優質的技術與服務。"
      },
      item5: {
        name: "國際團隊地圖",
        icon: "🌐",
        title: "全球化工作團隊",
        desc: "SHOPLINE 總部設立新加坡，於台灣、日本、美國、英國等地皆設有辦公室據點，組成超過 2,000 名員工的國際化團隊。"
      },
      item6: {
        name: "策略顧問放大鏡",
        icon: "🔍",
        title: "從執行到策略的 AI 思維",
        desc: "成立「AI 轉型委員會」，將 AI 導入內部工作流程。我們推動的不是冷冰冰的取代，而是推動服務模式從「執行任務」進一步升級為「洞察客戶需求、提供策略建議」！"
      }
    };

    // 初始化與開場
    window.onload = function() {
      renderInventoryGrid();
      showLoginModal();
    };

    function showLoginModal() {
      const bodyHtml = `
        <div style="text-align:center; padding: 10px 0;">
          <div style="font-size: 38px; margin-bottom: 8px;">🚀</div>
          <div style="color: var(--cyan-bright); font-size: 1.1rem; font-weight:bold; margin-bottom: 6px;">SHOPLINE 入職探索啟程</div>
          <div style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px;">歡迎來到 SHOPLINE 大家庭！請輸入你的姓名開始冒險：</div>
          <input type="text" id="nameInput" placeholder="請輸入姓名" 
                 style="width: 80%; padding: 10px; background:#070d14; border:1px solid var(--cyan-deep); color:#fff; border-radius:4px; font-size:1rem; text-align:center; outline:none;" />
        </div>
      `;
      openModal("入職報到處", bodyHtml, `
        <button class="btn" onclick="handleStartGame()">踏入總部 ➔</button>
      `, false);
    }

    function handleStartGame() {
      const val = document.getElementById("nameInput").value.trim();
      if (!val) {
        alert("請輸入姓名以完成入職登錄！");
        return;
      }
      gameState.userName = val;
      gameState.startTime = new Date();
      document.getElementById("playerBadge").innerText = `探索者：${val}`;
      closeModal();
      loadChapter(1);
    }

    // 章節載入
    function loadChapter(ch) {
      gameState.chapter = ch;
      const canvas = document.getElementById("interactiveCanvas");
      canvas.innerHTML = "";

      if (ch === 1) {
        document.getElementById("sceneTitle").innerText = "第 1 章：新手報到！走進 SHOPLINE 零售世界";
        updateProgressCounter();
        renderQuestList();

        // 放置 3 個發光物件 (對應位置)
        createHotspot("item1", "迎賓櫃台", "🏢", "20%", "20%");
        createHotspot("item2", "品牌櫥窗", "🛍️", "25%", "65%");
        createHotspot("item3", "書報架", "📚", "60%", "25%");

        // 放置 NPC Luke
        createNpc("Luke", "資深工程師", "💻", () => triggerNpcLuke());
      } else {
        document.getElementById("sceneTitle").innerText = "第 2 章：協作前行！文化使命與未來藍圖";
        updateProgressCounter();
        renderQuestList();

        // 放置 3 個發光物件
        createHotspot("item4", "霓虹光牆", "💡", "20%", "20%");
        createHotspot("item5", "地球儀", "🌍", "25%", "65%");
        createHotspot("item6", "AI 白板", "📊", "60%", "25%");

        // 放置 NPC Una
        createNpc("Una", "客戶成功顧問", "👩‍💼", () => triggerNpcUna());
      }
    }

    // 建立物件點擊熱點
    function createHotspot(id, name, icon, top, left) {
      const canvas = document.getElementById("interactiveCanvas");
      const el = document.createElement("div");
      el.className = `hotspot ${gameState.inventory[id] ? "collected" : ""}`;
      el.id = `hotspot-${id}`;
      el.style.top = top;
      el.style.left = left;
      el.innerHTML = `
        <div class="icon">${icon}</div>
        <div class="label">${name}</div>
      `;
      el.onclick = () => inspectItem(id);
      canvas.appendChild(el);
    }

    // 建立 NPC
    function createNpc(name, title, icon, onClickHandler) {
      const canvas = document.getElementById("interactiveCanvas");
      const el = document.createElement("div");
      el.className = "npc-avatar";
      el.innerHTML = `
        <div class="npc-badge">${title}</div>
        <div style="font-size:36px; margin-top:8px;">${icon}</div>
        <div style="font-weight:bold; color:var(--text-main); margin-top:5px;">${name}</div>
      `;
      el.onclick = onClickHandler;
      canvas.appendChild(el);
    }

    // 點擊調查物件
    function inspectItem(id) {
      const item = ITEM_CONFIG[id];
      const isCollected = gameState.inventory[id];

      const bodyHtml = `
        <div style="color:var(--cyan-bright); font-weight:bold; font-size:1.05rem; margin-bottom:8px;">${item.title}</div>
        <p style="color:var(--text-main); line-height:1.7;">${item.desc}</p>
      `;

      const footHtml = isCollected 
        ? `<button class="btn" onclick="closeModal()">已收藏於手冊</button>`
        : `<button class="btn" onclick="collectItem('${id}')">收進隨身手冊 🎒</button>`;

      openModal(`探索線索：${item.name}`, bodyHtml, footHtml);
    }

    // 收藏至手冊
    function collectItem(id) {
      gameState.inventory[id] = true;
      renderInventoryGrid();
      updateProgressCounter();

      const hs = document.getElementById(`hotspot-${id}`);
      if (hs) hs.classList.add("collected");

      closeModal();
    }

    // 渲染手冊網格
    function renderInventoryGrid() {
      const grid = document.getElementById("inventoryGrid");
      grid.innerHTML = "";

      for (let i = 1; i <= 6; i++) {
        const id = `item${i}`;
        const item = ITEM_CONFIG[id];
        const unlocked = gameState.inventory[id];

        const slot = document.createElement("div");
        slot.className = `inventory-slot ${unlocked ? "unlocked" : ""}`;
        slot.innerHTML = `
          <div class="slot-icon">${unlocked ? item.icon : "🔒"}</div>
          <div class="slot-name">${unlocked ? item.name : "未解鎖"}</div>
        `;
        if (unlocked) {
          slot.onclick = () => inspectItem(id);
        }
        grid.appendChild(slot);
      }
    }

    function updateProgressCounter() {
      const ch1Count = (gameState.inventory.item1 ? 1 : 0) + (gameState.inventory.item2 ? 1 : 0) + (gameState.inventory.item3 ? 1 : 0);
      const ch2Count = (gameState.inventory.item4 ? 1 : 0) + (gameState.inventory.item5 ? 1 : 0) + (gameState.inventory.item6 ? 1 : 0);
      if (gameState.chapter === 1) {
        document.getElementById("stepCounter").innerText = `線索收集：${ch1Count}/3`;
      } else {
        document.getElementById("stepCounter").innerText = `線索收集：${ch2Count}/3`;
      }
    }

    // 渲染任務清單
    function renderQuestList() {
      const q = document.getElementById("questList");
      if (gameState.chapter === 1) {
        q.innerHTML = `
          <div class="quest-item ${gameState.taskProgress.ch1_task1 ? "completed" : ""}">
            ${gameState.taskProgress.ch1_task1 ? "✓" : "○"} 任務 1：確認客戶定位（出示線索）
          </div>
          <div class="quest-item ${gameState.taskProgress.ch1_task2 ? "completed" : ""}">
            ${gameState.taskProgress.ch1_task2 ? "✓" : "○"} 任務 2：生活知名品牌連連看
          </div>
        `;
      } else {
        q.innerHTML = `
          <div class="quest-item ${gameState.taskProgress.ch2_task3 ? "completed" : ""}">
            ${gameState.taskProgress.ch2_task3 ? "✓" : "○"} 任務 3：對齊團隊最高核心使命
          </div>
          <div class="quest-item ${gameState.taskProgress.ch2_task4 ? "completed" : ""}">
            ${gameState.taskProgress.ch2_task4 ? "✓" : "○"} 任務 4：理解內部的 AI 升級思維
          </div>
        `;
      }
    }

    // NPC Luke 任務對話 (第 1 章)
    function triggerNpcLuke() {
      const hasAllCh1 = gameState.inventory.item1 && gameState.inventory.item2 && gameState.inventory.item3;

      if (!hasAllCh1) {
        openModal("資深工程師 Luke", `
          <div class="dialogue-text">
            「嗨！歡迎加入！我是研發團隊的 Luke。大廳接待台、展示櫥窗和書報架都有很重要的認識指南，先去逛逛把它們收進隨身手冊，再來找我喔！」
          </div>
        `, `<button class="btn" onclick="closeModal()">好的，我先去收集</button>`);
        return;
      }

      if (!gameState.taskProgress.ch1_task1) {
        startTask1();
      } else if (!gameState.taskProgress.ch1_task2) {
        startTask2();
      } else {
        openModal("資深工程師 Luke", `
          <div class="dialogue-text">
            「第一章任務全數搞定！大廳後方的電梯已經解鎖，快去 2 樓的協作交流露台找 Una 吧！」
          </div>
        `, `<button class="btn" onclick="loadChapter(2); closeModal();">前往第 2 章 ➔</button>`);
      }
    }

    // 任務 1
    function startTask1() {
      const bodyHtml = `
        <div class="dialogue-text">
          「歡迎加入！讓我們一起來認識 SHOPLINE 大家庭。我是 Luke，看到你的手冊已經收齊了入門筆記！有些新夥伴常問：『我們到底在服務誰？只做大品牌還是只做小網拍？』你能從手冊挑出對應的道具解答嗎？」
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright);">請從手冊出示正確線索：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask1('item1')">💳 出示：[70萬品牌見證名片]</div>
          <div class="option-btn" onclick="answerTask1('item2')">✨ 出示：[知名品牌合作圖鑑]</div>
          <div class="option-btn" onclick="answerTask1('item3')">🎓 出示：[電商成長學苑通行證]</div>
        </div>
      `;
      openModal("Luke 的任務 1：客戶定位", bodyHtml, "");
    }

    function answerTask1(choice) {
      if (choice === "item1") {
        gameState.taskProgress.ch1_task1 = true;
        renderQuestList();
        openModal("Luke：回答正確！", `
          <div class="dialogue-text">
            「答對了！我們致力於為各種規模的品牌提供一站式零售解決方案，從小創業者到大企業，全球已有超過 70 萬家品牌客戶！」
          </div>
        `, `<button class="btn" onclick="startTask2()">進行下一項任務 ➔</button>`);
      } else {
        gameState.wrongAttempts++;
        const hint = choice === "item2" 
          ? "這張是具體的合作品牌，再找找看手冊裡記錄著『服務對象涵蓋哪些規模』的那張名片喔！" 
          : "這是我們的培訓平台！請找找看記錄著客戶定位與累積 70 萬客戶的那張名片！";
        openModal("Luke 的提示", `<div class="dialogue-text">「${hint}」</div>`, `<button class="btn" onclick="startTask1()">重新出示</button>`);
      }
    }

    // 任務 2
    function startTask2() {
      const bodyHtml = `
        <div class="dialogue-text">
          「其實我們的系統就在大家的日常生活中！走在路上逛街常常能遇到我們的客戶，你手冊裡有沒有記載具體有哪些大家熟悉的品牌？」
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright);">請出示正確生活品牌圖鑑：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask2('item2')">✨ 出示：[知名品牌合作圖鑑]（綠藤生機、vacanza、青鳥旅行...）</div>
          <div class="option-btn" onclick="answerTask2('item1')">💳 出示：[70萬品牌見證名片]</div>
          <div class="option-btn" onclick="answerTask2('item3')">🎓 出示：[電商成長學苑通行證]</div>
        </div>
      `;
      openModal("Luke 的任務 2：生活品牌連連看", bodyHtml, "");
    }

    function answerTask2(choice) {
      if (choice === "item2") {
        gameState.taskProgress.ch1_task2 = true;
        renderQuestList();
        openModal("Luke：完全正確！", `
          <div class="dialogue-text">
            「完全正確！從美妝、保養到飾品、點心，這些大家愛逛的品牌都是我們的長期夥伴！第一章任務已全數搞定，快搭電梯去 2 樓露台找 Una 吧！」
          </div>
        `, `<button class="btn" onclick="loadChapter(2); closeModal();">前往第 2 章 ➔</button>`);
      } else {
        gameState.wrongAttempts++;
        const hint = choice === "item1" 
          ? "這張寫的是總客戶數量，手冊裡有一份記錄了具體知名品牌名稱的圖鑑，拿那份給我看看！"
          : "這張是給商家上課用的，再翻翻看展示櫥窗找到的品牌圖鑑吧！";
        openModal("Luke 的提示", `<div class="dialogue-text">「${hint}」</div>`, `<button class="btn" onclick="startTask2()">重新出示</button>`);
      }
    }

    // NPC Una 任務對話 (第 2 章)
    function triggerNpcUna() {
      const hasAllCh2 = gameState.inventory.item4 && gameState.inventory.item5 && gameState.inventory.item6;

      if (!hasAllCh2) {
        openModal("客戶成功顧問 Una", `
          <div class="dialogue-text">
            「哈囉！我是顧問 Una！露台光牆、地球儀和白板上記錄了我們的核心理念與全球團隊，先去把那 3 樣線索放進手冊，我們再來對齊最後的任務喔！」
          </div>
        `, `<button class="btn" onclick="closeModal()">好的，我先去收集</button>`);
        return;
      }

      if (!gameState.taskProgress.ch2_task3) {
        startTask3();
      } else if (!gameState.taskProgress.ch2_task4) {
        startTask4();
      } else {
        showFinalVictory();
      }
    }

    // 任務 3
    function startTask3() {
      const bodyHtml = `
        <div class="dialogue-text">
          「嗨！恭喜你抵達第二章！在 SHOPLINE，不論是否具有電商經驗，只要掌握我們共同的使命與對未來的期待，就能快速融入大家。在我們日常工作中，SHOPLINE 最核心的企業使命與信念是什麼？」
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright);">請出示核心使命道具：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask3('item4')">🧭 出示：[品牌使命指南針]（店家的成功才是我們的成功！）</div>
          <div class="option-btn" onclick="answerTask3('item5')">🌐 出示：[國際團隊地圖]</div>
          <div class="option-btn" onclick="answerTask3('item6')">🔍 出示：[策略顧問放大鏡]</div>
        </div>
      `;
      openModal("Una 的任務 3：團隊核心使命", bodyHtml, "");
    }

    function answerTask3(choice) {
      if (choice === "item4") {
        gameState.taskProgress.ch2_task3 = true;
        renderQuestList();
        openModal("Una：回答正確！", `
          <div class="dialogue-text">
            「完全正確！『店家的成功才是我們的成功』是我們所有人的北極星，只有客戶成功，SHOPLINE 才會成功！」
          </div>
        `, `<button class="btn" onclick="startTask4()">進行最後挑戰 ➔</button>`);
      } else {
        gameState.wrongAttempts++;
        const hint = choice === "item5" 
          ? "這是我們的辦公室分佈！請回頭找找那面閃閃發光、寫著我們最高精神指標的霓虹光牆道具！"
          : "這是我們 AI 轉型的方法！但最根本的心態與使命是關於『店家的成功』喔，換一個試試！";
        openModal("Una 的提示", `<div class="dialogue-text">「${hint}」</div>`, `<button class="btn" onclick="startTask3()">重新出示</button>`);
      }
    }

    // 任務 4
    function startTask4() {
      const bodyHtml = `
        <div class="dialogue-text">
          「最後一題！我們近年提出了四大 AI 佈局方向。我們成立『AI 轉型委員會』希望把服務模式提升到什麼層次？」
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright);">請出示代表 AI 服務升級的道具：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask4('item6')">🔍 出示：[策略顧問放大鏡]（從執行任務升級為洞察需求、策略建議）</div>
          <div class="option-btn" onclick="answerTask4('item4')">🧭 出示：[品牌使命指南針]</div>
          <div class="option-btn" onclick="answerTask4('item5')">🌐 出示：[國際團隊地圖]</div>
        </div>
      `;
      openModal("Una 的任務 4：AI 轉型思維", bodyHtml, "");
    }

    function answerTask4(choice) {
      if (choice === "item6") {
        gameState.taskProgress.ch2_task4 = true;
        renderQuestList();
        showFinalVictory();
      } else {
        gameState.wrongAttempts++;
        const hint = choice === "item4" 
          ? "這是核心使命！請看白板上針對『AI 轉型委員會』推動工作模式升級的具體描述喔！"
          : "這張是全球據點分佈，再看一下記錄著服務升級方向的白板筆記吧！";
        openModal("Una 的提示", `<div class="dialogue-text">「${hint}」</div>`, `<button class="btn" onclick="startTask4()">重新出示</button>`);
      }
    }

    // 通關結算畫面與回傳後台
    function showFinalVictory() {
      const duration = Math.floor((new Date() - gameState.startTime) / 1000);

      // 背景發送數據至 Google Apps Script
      sendDataToGAS({
        userName: gameState.userName,
        status: "完成",
        durationSeconds: duration,
        wrongAttempts: gameState.wrongAttempts,
        itemsCollected: 6
      });

      const bodyHtml = `
        <div style="text-align:center; padding: 10px 0;">
          <div style="font-size: 40px; margin-bottom: 6px;">🏆</div>
          <div style="font-size: 1.15rem; font-weight:bold; color:var(--accent-gold); margin-bottom: 12px;">SHOPLINE 零售探索領航員</div>
          
          <div style="background:#09121d; border:1px solid #1f3957; padding: 12px; border-radius:6px; font-size:0.85rem; line-height:1.7; text-align:left; color:#f0f6fc; margin-bottom:14px;">
            恭喜破關！🎉<br>
            你已經順利完成 SHOPLINE 入職探索任務並掌握了團隊的核心密碼：<br>
            了解我們陪伴無數生活知名品牌的成長、熟悉用電商成長學苑賦能知識，並連結全球 超過 2,000 名跨國夥伴。<br>
            最重要的是，將『店家的成功才是我們的成功』放在心上，一起用開放與創新的思維迎接未來！<br><br>
            <strong>歡迎正式加入 SHOPLINE 大家庭！</strong>
          </div>

          <div style="font-size:0.8rem; color:var(--text-sub);">
            通關探索者：${gameState.userName} ｜ 耗時：${duration} 秒 ｜ 提示重試：${gameState.wrongAttempts} 次
          </div>
        </div>
      `;

      openModal("入職認證達成", bodyHtml, `<button class="btn" onclick="closeModal()">完成旅程</button>`, false);
    }

    // 發送資料至 Google Apps Script
    async function sendDataToGAS(payload) {
      if (!GAS_URL || GAS_URL === "YOUR_GAS_URL_HERE") {
        console.log("未設定 GAS_URL，已略過資料上傳。");
        return;
      }

      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });
        console.log("資料已順利回傳至 Google Sheets");
      } catch (err) {
        console.error("後台傳輸異常：", err);
      }
    }

    // Modal 與抽屜控制
    function openModal(title, body, foot, closable = true) {
      document.getElementById("modalHead").innerHTML = `<span>${title}</span>` + (closable ? `<span style="cursor:pointer;" onclick="closeModal()">✕</span>` : "");
      document.getElementById("modalBody").innerHTML = body;
      document.getElementById("modalFoot").innerHTML = foot;
      document.getElementById("modalBackdrop").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalBackdrop").style.display = "none";
    }

    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      sb.classList.toggle("open");
    }
  </script>
</body>
</html>
