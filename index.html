<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHOPLINE 新人探索冒險：探索團隊核心密碼</title>
  <style>
    :root {
      --bg-dark: #070d18;
      --panel-bg: rgba(13, 23, 38, 0.95);
      --panel-border: #1d3b5e;
      --cyan-bright: #00C2FF;
      --cyan-deep: #0077B6;
      --cyan-glow: rgba(0, 194, 255, 0.35);
      --accent-green: #00E599;
      --accent-gold: #FFD166;
      --text-main: #EBF5FF;
      --text-sub: #8EA8C3;
      --pixel-font: "Courier New", "Noto Sans TC", monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 194, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 119, 182, 0.15) 0%, transparent 45%);
      color: var(--text-main);
      font-family: var(--pixel-font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導航列 */
    header {
      height: 52px;
      background: rgba(8, 14, 24, 0.98);
      border-bottom: 2px solid var(--cyan-deep);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 15px var(--cyan-glow);
      z-index: 50;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--cyan-bright);
      text-shadow: 0 0 10px var(--cyan-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-badge {
      font-size: 0.85rem;
      background: #0f2238;
      padding: 4px 10px;
      border: 1px solid var(--cyan-bright);
      border-radius: 4px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mobile-backpack-btn {
      display: none;
      background: #112844;
      color: var(--cyan-bright);
      border: 1px solid var(--cyan-bright);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 主舞台 */
    .game-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左側探索場景 */
    .viewport {
      flex: 1.4;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--panel-border);
      background: #060b13;
      overflow: hidden;
    }

    .scene-meta {
      padding: 10px 16px;
      background: rgba(13, 23, 38, 0.85);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .scene-title {
      color: var(--cyan-bright);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .interactive-canvas {
      flex: 1;
      position: relative;
      background: radial-gradient(#142438 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: hidden;
    }

    /* 玩家自己的場景像素人物 */
    .player-character-stage {
      position: absolute;
      bottom: 25px;
      left: 30px;
      width: 105px;
      height: 145px;
      background: linear-gradient(180deg, #112d4d 0%, #0a1829 100%);
      border: 2px solid var(--cyan-bright);
      box-shadow: 0 0 20px var(--cyan-glow);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      animation: playerIdle 2.5s ease-in-out infinite alternate;
    }

    .player-stage-badge {
      position: absolute;
      top: -11px;
      background: var(--cyan-bright);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .player-stage-avatar {
      font-size: 40px;
      margin-top: 4px;
    }

    .player-stage-name {
      margin-top: 4px;
      font-weight: bold;
      font-size: 11px;
      color: #ffffff;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes playerIdle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* 發光探索物件 */
    .hotspot {
      position: absolute;
      width: 82px;
      height: 82px;
      background: rgba(14, 27, 46, 0.9);
      border: 2px solid var(--cyan-bright);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: floatItem 3s ease-in-out infinite alternate;
    }

    .hotspot:hover, .hotspot:active {
      transform: scale(1.08);
      background: rgba(0, 194, 255, 0.25);
      box-shadow: 0 0 25px var(--cyan-bright);
    }

    .hotspot.collected {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 229, 153, 0.4);
      opacity: 0.8;
    }

    .hotspot .icon {
      font-size: 28px;
      margin-bottom: 2px;
    }

    .hotspot .label {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
    }

    @keyframes floatItem {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    /* 可愛像素 NPC 立繪卡片 */
    .npc-character {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 115px;
      height: 155px;
      background: linear-gradient(180deg, #183354 0%, #0d1e33 100%);
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 25px rgba(255, 209, 102, 0.35);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 20;
      animation: floatNpc 2.8s ease-in-out infinite alternate;
    }

    .npc-character:hover, .npc-character:active {
      transform: scale(1.06);
    }

    .npc-badge {
      position: absolute;
      top: -12px;
      background: var(--accent-gold);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .npc-avatar-art {
      width: 66px;
      height: 66px;
      background: #0a1320;
      border: 2px solid var(--cyan-bright);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-top: 6px;
      box-shadow: inset 0 0 10px rgba(0, 194, 255, 0.5);
    }

    .npc-name {
      margin-top: 6px;
      font-weight: bold;
      font-size: 12px;
      color: #ffffff;
    }

    .npc-click-hint {
      font-size: 9px;
      color: var(--accent-gold);
      margin-top: 2px;
      animation: blink 1.2s infinite;
    }

    @keyframes floatNpc {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 右側隨身手冊與任務 */
    .sidebar {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-block {
      background: rgba(10, 17, 28, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-header {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--cyan-bright);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 6px;
    }

    .quest-item {
      font-size: 0.85rem;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #0d1a29;
      border-left: 3px solid #2e4d70;
      color: var(--text-sub);
      border-radius: 0 4px 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quest-item.completed {
      border-left-color: var(--accent-green);
      color: #ffffff;
      background: #0d2621;
    }

    /* 手冊道具網格 */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .inventory-slot {
      aspect-ratio: 1;
      background: #0b1422;
      border: 1px dashed #223f61;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .inventory-slot.unlocked {
      border: 1px solid var(--cyan-bright);
      background: rgba(0, 194, 255, 0.12);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .inventory-slot .slot-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .inventory-slot .slot-name {
      font-size: 10px;
      color: var(--text-main);
      line-height: 1.2;
    }

    /* 角色自選卡片樣式 */
    .avatar-selection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    .avatar-card {
      border: 2px solid #204169;
      border-radius: 8px;
      padding: 8px 4px;
      background: #0d1b2d;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
    }

    .avatar-card:hover, .avatar-card.active {
      border-color: var(--cyan-bright);
      background: rgba(0, 194, 255, 0.2);
      box-shadow: 0 0 12px var(--cyan-glow);
      transform: scale(1.05);
    }

    .avatar-card .av-icon {
      font-size: 32px;
      margin-bottom: 2px;
    }

    .avatar-card .av-desc {
      font-size: 10px;
      color: var(--text-sub);
    }

    /* RPG 冒險對話彈窗 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 7, 12, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .rpg-dialogue-box {
      background: #0c1626;
      border: 2px solid var(--cyan-bright);
      border-radius: 10px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 35px var(--cyan-glow);
      overflow: hidden;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .rpg-head {
      background: linear-gradient(90deg, #132e4d, #091524);
      padding: 10px 16px;
      border-bottom: 1px solid var(--cyan-deep);
      font-weight: bold;
      color: var(--cyan-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rpg-body {
      padding: 18px;
    }

    .dialogue-bubble {
      display: flex;
      gap: 14px;
      background: #070e17;
      border: 1px solid #1a3657;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .dialogue-avatar {
      width: 56px;
      height: 56px;
      background: #11253d;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }

    .dialogue-content {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #f0f7ff;
    }

    .dialogue-speaker {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 11px 15px;
      background: #132438;
      border: 1px solid #234366;
      border-radius: 6px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .option-btn:hover, .option-btn:active {
      background: #1a385c;
      border-color: var(--cyan-bright);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .btn {
      background: var(--cyan-deep);
      color: #fff;
      border: 1px solid var(--cyan-bright);
      padding: 9px 18px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--pixel-font);
      font-weight: bold;
      transition: all 0.15s;
    }

    .btn:hover, .btn:active {
      background: var(--cyan-bright);
      color: #000;
      box-shadow: 0 0 15px var(--cyan-bright);
    }

    @media (max-width: 768px) {
      .game-container {
        flex-direction: column;
      }
      .viewport {
        flex: 1;
        border-right: none;
      }
      .mobile-backpack-btn {
        display: block;
      }
      .sidebar {
        position: fixed;
        top: 52px;
        left: 0;
        width: 100%;
        height: calc(100% - 52px);
        transform: translateY(100%);
        transition: transform 0.3s ease;
        z-index: 80;
      }
      .sidebar.open {
        transform: translateY(0);
      }
      .player-character-stage {
        bottom: 15px;
        left: 15px;
        width: 90px;
        height: 125px;
      }
      .avatar-selection-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

  <header>
    <div class="brand-title">
      <span>🔷 SHOPLINE</span>

  <div class="game-container">

      <div class="scene-meta">
        <span id="sceneTitle" class="scene-title">第 1 章：新手報到！走進 SHOPLINE 零售世界</span>

      </div>

    <div class="sidebar" id="sidebar">
      <div style="display:flex; justify-content:space-between; align-items:center;" class="mobile-backpack-btn" onclick="toggleSidebar()">

  </div>

  <!-- 對話與線索彈窗 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="rpg-dialogue-box" id="rpgBox">
      <div class="rpg-head" id="modalHead">標題</div>

  <script>
    // 可選角色清單
    const AVATAR_OPTIONS = [
      { id: "char1", icon: "🧑‍💻", title: "活力探索者" },
      { id: "char2", icon: "👩‍💼", title: "優雅策略家" },

      },
      item5: {
        name: "國際團隊地圖",
        icon: "🌐",
        title: "全球化工作團隊",
        desc: "SHOPLINE 總部設立新加坡，於台灣、日本、美國、英國等地皆設有辦公室據點，組成超過 2,000 名員工的國際化團隊。"
      },
      item6: {
        name: "策略顧問放大鏡",

        title: "從執行到策略的 AI 思維",
        desc: "成立「AI 轉型委員會」，將 AI 導入內部工作流程。我們推動的不是冷冰冰的取代，而是推動服務模式從「執行任務」進一步升級為「洞察客戶需求、提供策略建議」！"
      }
    };

    window.onload = function() {
      renderInventoryGrid();
      showLoginModal();
    };

    function showLoginModal() {
      const avatarGridHtml = AVATAR_OPTIONS.map((av, index) => `
        <div class="avatar-card ${index === 0 ? "active" : ""}" id="avCard-${av.id}" onclick="chooseAvatar('${av.id}')">
          <div class="av-icon">${av.icon}</div>
          <div class="av-desc">${av.title}</div>
        </div>
      `).join("");

      const bodyHtml = `
        <div style="text-align:center; padding: 6px 0;">
          <div style="font-size: 38px; margin-bottom: 4px;">🔷</div>
          <div style="color: var(--cyan-bright); font-size: 1.15rem; font-weight:bold; margin-bottom: 4px;">SHOPLINE 入職報到處</div>
          <div style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 14px;">請選擇你的探索形象並輸入姓名：</div>

          <div style="text-align:left; font-size:0.8rem; color:var(--cyan-bright); font-weight:bold; margin-bottom:4px;">1. 選擇角色形象：</div>
          <div class="avatar-selection-grid">
            ${avatarGridHtml}
          </div>

          <div style="text-align:left; font-size:0.8rem; color:var(--cyan-bright); font-weight:bold; margin-bottom:6px;">2. 輸入姓名：</div>
          <input type="text" id="nameInput" placeholder="請輸入姓名" 
                 style="width: 100%; padding: 11px; background:#070f1a; border:1px solid var(--cyan-deep); color:#fff; border-radius:4px; font-size:0.95rem; text-align:center; outline:none;" />
        </div>
      `;
      openModal("入職登錄", bodyHtml, `<button class="btn" onclick="handleStartGame()">踏入總部 ➔</button>`, false);
    }

    function chooseAvatar(id) {
      selectedAvatar = AVATAR_OPTIONS.find(a => a.id === id);
      AVATAR_OPTIONS.forEach(a => {
        const el = document.getElementById(`avCard-${a.id}`);
        if (el) el.classList.remove("active");
      });
      const activeEl = document.getElementById(`avCard-${id}`);
      if (activeEl) activeEl.classList.add("active");
    }

    function handleStartGame() {
      const val = document.getElementById("nameInput").value.trim();
      if (!val) {
        alert("請輸入姓名以完成報到！");
        return;
      }
      gameState.userName = val;
      gameState.avatar = selectedAvatar;
      gameState.startTime = new Date();

      document.getElementById("playerBadgeIcon").innerText = gameState.avatar.icon;
      document.getElementById("playerBadgeName").innerText = val;

      closeModal();
      loadChapter(1);
    }

    function loadChapter(ch) {
      gameState.chapter = ch;
      const canvas = document.getElementById("interactiveCanvas");
      canvas.innerHTML = "";

      // 渲染玩家自己的專屬場景立繪
      createPlayerOnStage();

      if (ch === 1) {
        document.getElementById("sceneTitle").innerText = "第 1 章：新手報到！走進 SHOPLINE 零售世界";
        updateProgressCounter();
        renderQuestList();

        createHotspot("item1", "迎賓櫃台", "🏢", "18%", "25%");
        createHotspot("item2", "品牌櫥窗", "🛍️", "25%", "65%");
        createHotspot("item3", "書報架", "📚", "58%", "35%");

        createNpc("Luke", "資深工程師", "👨‍💻", () => triggerNpcLuke());
      } else {
        document.getElementById("sceneTitle").innerText = "第 2 章：協作前行！文化使命與未來藍圖";
        updateProgressCounter();
        renderQuestList();

        createHotspot("item4", "霓虹光牆", "💡", "18%", "25%");
        createHotspot("item5", "地球儀", "🌍", "25%", "65%");
        createHotspot("item6", "AI 白板", "📊", "58%", "35%");

        createNpc("Una", "客戶成功顧問", "👩‍💼", () => triggerNpcUna());
      }
    }

    // 在場景中建立玩家角色
    function createPlayerOnStage() {
      const canvas = document.getElementById("interactiveCanvas");
      const el = document.createElement("div");
      el.className = "player-character-stage";
      el.innerHTML = `
        <div class="player-stage-badge">YOU</div>
        <div class="player-stage-avatar">${gameState.avatar.icon}</div>
        <div class="player-stage-name">${gameState.userName}</div>
      `;
      canvas.appendChild(el);
    }

    function createHotspot(id, name, icon, top, left) {
      const canvas = document.getElementById("interactiveCanvas");
      const el = document.createElement("div");
      el.className = `hotspot ${gameState.inventory[id] ? "collected" : ""}`;
      el.id = `hotspot-${id}`;
      el.style.top = top;
      el.style.left = left;
      el.innerHTML = `
        <div class="icon">${icon}</div>
        <div class="label">${name}</div>
      `;
      el.onclick = () => inspectItem(id);
      canvas.appendChild(el);
    }

    function createNpc(name, title, icon, onClickHandler) {
      const canvas = document.getElementById("interactiveCanvas");
      const el = document.createElement("div");
      el.className = "npc-character";
      el.innerHTML = `
        <div class="npc-badge">${title}</div>
        <div class="npc-avatar-art">${icon}</div>
        <div class="npc-name">${name}</div>
        <div class="npc-click-hint">點我對話 💬</div>
      `;
      el.onclick = onClickHandler;
      canvas.appendChild(el);
    }

    function inspectItem(id) {
      const item = ITEM_CONFIG[id];
      const isCollected = gameState.inventory[id];

      const bodyHtml = `
        <div class="dialogue-bubble">
          <div class="dialogue-avatar">${item.icon}</div>
          <div class="dialogue-content">
            <div class="dialogue-speaker">${item.title}</div>
            ${item.desc}
          </div>
        </div>
      `;

      const footHtml = isCollected 
        ? `<button class="btn" onclick="closeModal()">已放入隨身手冊</button>`
        : `<button class="btn" onclick="collectItem('${id}')">收進隨身手冊 🎒</button>`;

      openModal(`探索調查：${item.name}`, bodyHtml, footHtml);
    }

    function collectItem(id) {
      gameState.inventory[id] = true;
      renderInventoryGrid();
      updateProgressCounter();

      const hs = document.getElementById(`hotspot-${id}`);
      if (hs) hs.classList.add("collected");

      closeModal();
    }

    function renderInventoryGrid() {
      const grid = document.getElementById("inventoryGrid");
      grid.innerHTML = "";

      for (let i = 1; i <= 6; i++) {
        const id = `item${i}`;
        const item = ITEM_CONFIG[id];
        const unlocked = gameState.inventory[id];

        const slot = document.createElement("div");
        slot.className = `inventory-slot ${unlocked ? "unlocked" : ""}`;
        slot.innerHTML = `
          <div class="slot-icon">${unlocked ? item.icon : "🔒"}</div>
          <div class="slot-name">${unlocked ? item.name : "未收集"}</div>
        `;
        if (unlocked) {
          slot.onclick = () => inspectItem(id);
        }
        grid.appendChild(slot);
      }
    }

    function updateProgressCounter() {
      const ch1Count = (gameState.inventory.item1 ? 1 : 0) + (gameState.inventory.item2 ? 1 : 0) + (gameState.inventory.item3 ? 1 : 0);
      const ch2Count = (gameState.inventory.item4 ? 1 : 0) + (gameState.inventory.item5 ? 1 : 0) + (gameState.inventory.item6 ? 1 : 0);
      if (gameState.chapter === 1) {
        document.getElementById("stepCounter").innerText = `線索收集：${ch1Count}/3`;
      } else {
        document.getElementById("stepCounter").innerText = `線索收集：${ch2Count}/3`;
      }
    }

    function renderQuestList() {
      const q = document.getElementById("questList");
      if (gameState.chapter === 1) {
        q.innerHTML = `
          <div class="quest-item ${gameState.taskProgress.ch1_task1 ? "completed" : ""}">
            ${gameState.taskProgress.ch1_task1 ? "✓" : "○"} 任務 1：確認客戶定位（出示線索）
          </div>
          <div class="quest-item ${gameState.taskProgress.ch1_task2 ? "completed" : ""}">
            ${gameState.taskProgress.ch1_task2 ? "✓" : "○"} 任務 2：生活知名品牌連連看
          </div>
        `;
      } else {
        q.innerHTML = `
          <div class="quest-item ${gameState.taskProgress.ch2_task3 ? "completed" : ""}">
            ${gameState.taskProgress.ch2_task3 ? "✓" : "○"} 任務 3：對齊團隊最高核心使命
          </div>
          <div class="quest-item ${gameState.taskProgress.ch2_task4 ? "completed" : ""}">
            ${gameState.taskProgress.ch2_task4 ? "✓" : "○"} 任務 4：理解內部的 AI 升級思維
          </div>
        `;
      }
    }

    // NPC Luke 任務對話
    function triggerNpcLuke() {
      const hasAllCh1 = gameState.inventory.item1 && gameState.inventory.item2 && gameState.inventory.item3;

      if (!hasAllCh1) {
        const bodyHtml = `
          <div class="dialogue-bubble">
            <div class="dialogue-avatar">👨‍💻</div>
            <div class="dialogue-content">
              <div class="dialogue-speaker">資深工程師 Luke</div>
              「嗨！歡迎加入！我是研發團隊的 Luke。大廳接待台、展示櫥窗和書報架都有很重要的認識指南，先去逛逛把它們收進隨身手冊，再來找我喔！」
            </div>
          </div>
        `;
        openModal("Luke 的提醒", bodyHtml, `<button class="btn" onclick="closeModal()">好的，我先去收集</button>`);
        return;
      }

      if (!gameState.taskProgress.ch1_task1) {
        startTask1();
      } else if (!gameState.taskProgress.ch1_task2) {
        startTask2();
      } else {
        const bodyHtml = `
          <div class="dialogue-bubble">
            <div class="dialogue-avatar">👨‍💻</div>
            <div class="dialogue-content">
              <div class="dialogue-speaker">資深工程師 Luke</div>
              「第一章任務全數搞定！大廳後方的電梯已經解鎖，快去 2 樓的協作交流露台找 Una 吧！」
            </div>
          </div>
        `;
        openModal("第 1 章通關", bodyHtml, `<button class="btn" onclick="loadChapter(2); closeModal();">前往第 2 章 ➔</button>`);
      }
    }

    function startTask1() {
      const bodyHtml = `
        <div class="dialogue-bubble">
          <div class="dialogue-avatar">👨‍💻</div>
          <div class="dialogue-content">
            <div class="dialogue-speaker">資深工程師 Luke</div>
            「歡迎加入！讓我們一起來認識 SHOPLINE 大家庭。我是 Luke，看到你的手冊已經收齊了入門筆記！有些新夥伴常問：『我們到底在服務誰？只做大品牌還是只做小網拍？』你能從手冊挑出對應的道具解答嗎？」
          </div>
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright); font-size:0.9rem;">請從手冊出示正確線索：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask1('item1')">💳 出示：[70萬品牌見證名片]</div>
          <div class="option-btn" onclick="answerTask1('item2')">✨ 出示：[知名品牌合作圖鑑]</div>
          <div class="option-btn" onclick="answerTask1('item3')">🎓 出示：[電商成長學苑通行證]</div>
        </div>
      `;
      openModal("情境任務 1：客戶定位", bodyHtml, "");
    }

    function answerTask1(choice) {
      if (choice === "item1") {
        gameState.taskProgress.ch1_task1 = true;
        renderQuestList();
        const bodyHtml =
