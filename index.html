<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHOPLINE 新人探索冒險：探索團隊核心密碼</title>
  <style>
    :root {
      --bg-dark: #070d18;
      --panel-bg: rgba(13, 23, 38, 0.95);
      --panel-border: #1d3b5e;
      --cyan-bright: #00C2FF;
      --cyan-deep: #0077B6;
      --cyan-glow: rgba(0, 194, 255, 0.35);
      --accent-green: #00E599;
      --accent-gold: #FFD166;
      --text-main: #EBF5FF;
      --text-sub: #8EA8C3;
      --pixel-font: "Courier New", "Noto Sans TC", monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 194, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 119, 182, 0.15) 0%, transparent 45%);
      color: var(--text-main);
      font-family: var(--pixel-font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導航列 */
    header {
      height: 52px;
      background: rgba(8, 14, 24, 0.98);
      border-bottom: 2px solid var(--cyan-deep);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 15px var(--cyan-glow);
      z-index: 50;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--cyan-bright);
      text-shadow: 0 0 10px var(--cyan-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-badge {
      font-size: 0.85rem;
      background: #0f2238;
      padding: 4px 10px;
      border: 1px solid var(--cyan-bright);
      border-radius: 4px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-player-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-backpack-btn {
      display: none;
      background: #112844;
      color: var(--cyan-bright);
      border: 1px solid var(--cyan-bright);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 主舞台 */
    .game-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左側探索場景 */
    .viewport {
      flex: 1.4;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--panel-border);
      background: #060b13;
      overflow: hidden;
    }

    .scene-meta {
      padding: 10px 16px;
      background: rgba(13, 23, 38, 0.85);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .scene-title {
      color: var(--cyan-bright);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .interactive-canvas {
      flex: 1;
      position: relative;
      background: radial-gradient(#142438 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: hidden;
    }

    /* 玩家場景像素人物 */
    .player-character-stage {
      position: absolute;
      bottom: 25px;
      left: 30px;
      width: 105px;
      height: 145px;
      background: linear-gradient(180deg, #112d4d 0%, #0a1829 100%);
      border: 2px solid var(--cyan-bright);
      box-shadow: 0 0 20px var(--cyan-glow);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      animation: playerIdle 2.5s ease-in-out infinite alternate;
    }

    .player-stage-badge {
      position: absolute;
      top: -11px;
      background: var(--cyan-bright);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .player-stage-avatar {
      width: 58px;
      height: 58px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-stage-name {
      margin-top: 4px;
      font-weight: bold;
      font-size: 11px;
      color: #ffffff;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes playerIdle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* 發光探索物件 */
    .hotspot {
      position: absolute;
      width: 82px;
      height: 82px;
      background: rgba(14, 27, 46, 0.9);
      border: 2px solid var(--cyan-bright);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: floatItem 3s ease-in-out infinite alternate;
    }

    .hotspot:hover, .hotspot:active {
      transform: scale(1.08);
      background: rgba(0, 194, 255, 0.25);
      box-shadow: 0 0 25px var(--cyan-bright);
    }

    .hotspot.collected {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 229, 153, 0.4);
      opacity: 0.8;
    }

    .hotspot .icon {
      font-size: 28px;
      margin-bottom: 2px;
    }

    .hotspot .label {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
    }

    @keyframes floatItem {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    /* 可愛像素 NPC 立繪卡片 */
    .npc-character {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 115px;
      height: 155px;
      background: linear-gradient(180deg, #183354 0%, #0d1e33 100%);
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 25px rgba(255, 209, 102, 0.35);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 20;
      animation: floatNpc 2.8s ease-in-out infinite alternate;
    }

    .npc-character:hover, .npc-character:active {
      transform: scale(1.06);
    }

    .npc-badge {
      position: absolute;
      top: -12px;
      background: var(--accent-gold);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .npc-avatar-art {
      width: 60px;
      height: 60px;
      background: #0a1320;
      border: 2px solid var(--cyan-bright);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      box-shadow: inset 0 0 10px rgba(0, 194, 255, 0.5);
    }

    .npc-name {
      margin-top: 6px;
      font-weight: bold;
      font-size: 12px;
      color: #ffffff;
    }

    .npc-click-hint {
      font-size: 9px;
      color: var(--accent-gold);
      margin-top: 2px;
      animation: blink 1.2s infinite;
    }

    @keyframes floatNpc {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 右側手冊與任務 */
    .sidebar {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-block {
      background: rgba(10, 17, 28, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-header {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--cyan-bright);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 6px;
    }

    .quest-item {
      font-size: 0.85rem;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #0d1a29;
      border-left: 3px solid #2e4d70;
      color: var(--text-sub);
      border-radius: 0 4px 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quest-item.completed {
      border-left-color: var(--accent-green);
      color: #ffffff;
      background: #0d2621;
    }

    /* 手冊道具網格 */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .inventory-slot {
      aspect-ratio: 1;
      background: #0b1422;
      border: 1px dashed #223f61;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .inventory-slot.unlocked {
      border: 1px solid var(--cyan-bright);
      background: rgba(0, 194, 255, 0.12);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .inventory-slot .slot-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .inventory-slot .slot-name {
      font-size: 10px;
      color: var(--text-main);
      line-height: 1.2;
    }

    /* 角色自選卡片樣式 */
    .avatar-selection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    .avatar-card {
      border: 2px solid #204169;
      border-radius: 8px;
      padding: 8px 4px;
      background: #0d1b2d;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
    }

    .avatar-card:hover, .avatar-card.active {
      border-color: var(--cyan-bright);
      background: rgba(0, 194, 255, 0.2);
      box-shadow: 0 0 12px var(--cyan-glow);
      transform: scale(1.05);
    }

    .avatar-card .av-icon-box {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .avatar-card .av-desc {
      font-size: 10px;
      color: var(--text-sub);
    }

    /* RPG 冒險對話彈窗 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 7, 12, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .rpg-dialogue-box {
      background: #0c1626;
      border: 2px solid var(--cyan-bright);
      border-radius: 10px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 35px var(--cyan-glow);
      overflow: hidden;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .rpg-head {
      background: linear-gradient(90deg, #132e4d, #091524);
      padding: 10px 16px;
      border-bottom: 1px solid var(--cyan-deep);
      font-weight: bold;
      color: var(--cyan-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rpg-body {
      padding: 18px;
    }

    .dialogue-bubble {
      display: flex;
      gap: 14px;
      background: #070e17;
      border: 1px solid #1a3657;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .dialogue-avatar-box {
      width: 52px;
      height: 52px;
      background: #11253d;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dialogue-content {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #f0f7ff;
    }

    .dialogue-speaker {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 11px 15px;
      background: #132438;
      border: 1px solid #234366;
      border-radius: 6px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .option-btn:hover, .option-btn:active {
      background: #1a385c;
      border-color: var(--cyan-bright);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .btn {
      background: var(--cyan-deep);
      color: #fff;
      border: 1px solid var(--cyan-bright);
      padding: 9px 18px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--pixel-font);
      font-weight: bold;
      transition: all 0.15s;
    }

    .btn:hover, .btn:active {
      background: var(--cyan-bright);
      color: #000;
      box-shadow: 0 0 15px var(--cyan-bright);
    }

    @media (max-width: 768px) {
      .game-container {
        flex-direction: column;
      }
      .viewport {
        flex: 1;
        border-right: none;
      }
      .mobile-backpack-btn {
        display: block;
      }
      .sidebar {
        position: fixed;
        top: 52px;
        left: 0;
        width: 100%;
        height: calc(100% - 52px);
        transform: translateY(100%);
        transition: transform 0.3s ease;
        z-index: 80;
      }
      .sidebar.open {
        transform: translateY(0);
      }
      .player-character-stage {
        bottom: 15px;
        left: 15px;
        width: 90px;
        height: 125px;
      }
      .avatar-selection-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

      closeModal();

      createPlayerOnStage();

      if (ch === 1) {

        renderQuestList();

        const unlocked = gameState.inventory[id];

        const slot = document.createElement("div");
        slot.className = `inventory-slot ${unlocked ? "unlocked" : ""}`;
        slot.innerHTML = `
          <div class="slot-icon">${unlocked ? item.icon : "🔒"}</div>
          <div class="slot-name">${unlocked ? item.name : "未收集"}</div>

        if (unlocked) {
          slot.onclick = () => inspectItem(id);
        }
        grid.appendChild(slot);
      }

            <div class="dialogue-content">
              <div class="dialogue-speaker">客戶成功顧問 Una</div>
              「哈囉！我是顧問 Una！露台光牆、地球儀和白板上記錄了我們的核心理念與全球團隊，先去把那 3 樣線索放進手冊，我們再來對齊最後的任務喔！」
            </div>
          </div>
        `;
        openModal("Una 的提醒", bodyHtml, `<button class="btn" onclick="closeModal()">好的，我先去收集</button>`);
        return;
      }

      if (!gameState.taskProgress.ch2_task3) {
        startTask3();
      } else if (!gameState.taskProgress.ch2_task4) {
        startTask4();
      } else {
        showFinalVictory();
      }
    }

    function startTask3() {
      const bodyHtml = `
        <div class="dialogue-bubble">
          <div class="dialogue-avatar-box">${PIXEL_ART.una}</div>
          <div class="dialogue-content">
            <div class="dialogue-speaker">客戶成功顧問 Una</div>
            「嗨！恭喜你抵達第二章！在 SHOPLINE，不論是否具有電商經驗，只要掌握我們共同的使命與對未來的期待，就能快速融入大家。在我們日常工作中，SHOPLINE 最核心的企業使命與信念是什麼？」
          </div>
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright); font-size:0.9rem;">請出示核心使命道具：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask3('item4')">🧭 出示：[品牌使命指南針]（店家的成功才是我們的成功！）</div>
          <div class="option-btn" onclick="answerTask3('item5')">🌐 出示：[國際團隊地圖]</div>
          <div class="option-btn" onclick="answerTask3('item6')">🔍 出示：[策略顧問放大鏡]</div>
        </div>
      `;
      openModal("情境任務 3：團隊核心使命", bodyHtml, "");
    }

    function answerTask3(choice) {
      if (choice === "item4") {
        gameState.taskProgress.ch2_task3 = true;
        renderQuestList();
        const bodyHtml = `
          <div class="dialogue-bubble">
            <div class="dialogue-avatar-box">${gameState.avatar.svg}</div>
            <div class="dialogue-content">
              <div class="dialogue-speaker">${gameState.userName}（出示 品牌使命指南針）</div>
              「店家的成功才是我們的成功！這就是我們共同的北極星。」
            </div>
          </div>
          <div class="dialogue-bubble">
            <div class="dialogue-avatar-box">${PIXEL_ART.una}</div>
            <div class="dialogue-content">
              <div class="dialogue-speaker">客戶成功顧問 Una</div>
              「完全正確！只有客戶成功，SHOPLINE 才會成功！」
            </div>
          </div>
        `;
        openModal("回答正確！", bodyHtml, `<button class="btn" onclick="startTask4()">進行最後挑戰 ➔</button>`);
      } else {
        gameState.wrongAttempts++;
        const hint = choice === "item5" 
          ? "這是我們的辦公室分佈！請回頭找找那面閃閃發光、寫著我們最高精神指標的霓虹光牆道具！"
          : "這是我們 AI 轉型的方法！但最根本的心態與使命是關於『店家的成功』喔，換一個試試！";
        const bodyHtml = `
          <div class="dialogue-bubble">
            <div class="dialogue-avatar-box">${PIXEL_ART.una}</div>
            <div class="dialogue-content">
              <div class="dialogue-speaker">客戶成功顧問 Una 的提示</div>
              「${hint}」
            </div>
          </div>
        `;
        openModal("提示與重試", bodyHtml, `<button class="btn" onclick="startTask3()">重新出示</button>`);
      }
    }

    function startTask4() {
      const bodyHtml = `
        <div class="dialogue-bubble">
          <div class="dialogue-avatar-box">${PIXEL_ART.una}</div>
          <div class="dialogue-content">
            <div class="dialogue-speaker">客戶成功顧問 Una</div>
            「最後一題！我們近年提出了四大 AI 佈局方向。我們成立『AI 轉型委員會』希望把服務模式提升到什麼層次？」
          </div>
        </div>
        <div style="font-weight:bold; margin-bottom:8px; color:var(--cyan-bright); font-size:0.9rem;">請出示代表 AI 服務升級的道具：</div>
        <div class="options-list">
          <div class="option-btn" onclick="answerTask4('item6')">🔍 出示：[策略顧問放大鏡]（從執行任務升級為洞察需求、策略建議）</div>
          <div class="option-btn" onclick="answerTask4('item4')">🧭 出示：[品牌使命指南針]</div>
          <div class="option-btn" onclick="answerTask4('item5')">🌐 出示：[國際團隊地圖]</div>
        </div>
      `;
      openModal("情境任務 4：AI 轉型思維", bodyHtml, "");
    }

    function answerTask4(choice) {
      if (choice === "item6") {
        gameState.taskProgress.ch2_task4 = true;
        renderQuestList();
        showFinalVictory();
      } else {
        gameState.wrongAttempts++;
        const hint = choice === "item4" 
          ? "這是核心使命！請看白板上針對『AI 轉型委員會』推動工作模式升級的具體描述喔！"
          : "這張是全球據點分佈，再看一下記錄著服務升級方向的白板筆記吧！";
        const bodyHtml = `
          <div class="dialogue-bubble">
            <div class="dialogue-avatar-box">${PIXEL_ART.una}</div>
            <div class="dialogue-content">
              <div class="dialogue-speaker">客戶成功顧問 Una 的提示</div>
              「${hint}」
            </div>
          </div>
        `;
        openModal("提示與重試", bodyHtml, `<button class="btn" onclick="startTask4()">重新出示</button>`);
      }
    }

    function showFinalVictory() {
      const duration = Math.floor((new Date() - gameState.startTime) / 1000);

      // 背景發送數據至 Google Apps Script
      sendDataToGAS({
        userName: gameState.userName,
        status: "完成",
        durationSeconds: duration,
        wrongAttempts: gameState.wrongAttempts,
        itemsCollected: 6
      });

      const bodyHtml = `
        <div style="text-align:center; padding: 10px 0;">
          <div style="display:flex; justify-content:center; align-items:center; gap:16px; margin-bottom:12px;">
            <div style="width:42px; height:42px;">${PIXEL_ART.luke}</div>
            <div style="width:58px; height:58px; border:2px solid var(--accent-gold); border-radius:50%; padding:4px; background:#0f2238;">${gameState.avatar.svg}</div>
            <div style="width:42px; height:42px;">${PIXEL_ART.una}</div>
          </div>

          <div style="font-size: 1.15rem; font-weight:bold; color:var(--accent-gold); margin-bottom: 12px;">SHOPLINE 零售探索領航員</div>
          
          <div style="background:#091422; border:1px solid #1c3859; padding: 14px; border-radius:6px; font-size:0.85rem; line-height:1.75; text-align:left; color:#f0f6fc; margin-bottom:14px;">
            恭喜破關！🎉<br>
            你已經順利完成 SHOPLINE 入職探索任務並掌握了團隊的核心密碼：<br>
            了解我們陪伴無數生活知名品牌的成長、熟悉用電商成長學苑賦能知識，並連結全球 超過 2,000 名跨國夥伴。<br>
            最重要的是，將『店家的成功才是我們的成功』放在心上，一起用開放與創新的思維迎接未來！<br><br>
            <strong>歡迎正式加入 SHOPLINE 大家庭！</strong>
          </div>

          <div style="font-size:0.8rem; color:var(--text-sub);">
            通關探索者：${gameState.userName} ｜ 耗時：${duration} 秒 ｜ 提示重試：${gameState.wrongAttempts} 次
          </div>
        </div>
      `;

      openModal("入職認證達成", bodyHtml, `<button class="btn" onclick="closeModal()">完成旅程</button>`, false);
    }

    async function sendDataToGAS(payload) {
      if (!GAS_URL || GAS_URL === "YOUR_GAS_URL_HERE") {
        console.warn("未設定 GAS_URL，略過資料傳輸。");
        return;
      }

      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });
        console.log("資料已成功傳送至 Google Sheets！");
      } catch (err) {
        console.error("傳輸失敗：", err);
      }
    }

    function openModal(title, body, foot, closable = true) {
      document.getElementById("modalHead").innerHTML = `<span>${title}</span>` + (closable ? `<span style="cursor:pointer;" onclick="closeModal()">✕</span>` : "");
      document.getElementById("modalBody").innerHTML = body;
      document.getElementById("modalFoot").innerHTML = foot;
      document.getElementById("modalBackdrop").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalBackdrop").style.display = "none";
    }

    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      sb.classList.toggle("open");
    }
  </script>
</body>
</html>
